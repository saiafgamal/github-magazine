<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Trending Weekly - {{LONG_DATE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d0d;color:#f4f1eb}body{font-family:'Readex Pro',sans-serif}a{color:inherit;text-decoration-color:currentColor;text-underline-offset:.18em}.magazine{display:flex;width:{{WIDTH}}vw;height:100vh;transition:transform .6s cubic-bezier(.76,0,.24,1)}.page{position:relative;width:100vw;height:100vh;flex:0 0 100vw;padding:7vh 7vw 10vh;overflow:hidden}.cover,.back{display:flex;flex-direction:column;justify-content:space-between;background:#0d0d0d;color:#f4f1eb}.cover-kicker,.cover-date,.cover-issue,.back-meta,.category,.repo-meta,.weekly-gain,.callout-title{font-family:'Readex Pro',sans-serif;text-transform:uppercase;letter-spacing:.14em}.cover-kicker{font-size:max(12px,1vw);opacity:.55}.cover-title{font-family:'Readex Pro',sans-serif;font-size:max(48px,8.5vw);font-weight:900;line-height:.9;max-width:11ch}.cover-subtitle{font-size:max(20px,2.2vw);line-height:1.2;max-width:28ch;opacity:.82}.cover-date{font-size:max(13px,1.1vw);opacity:.5}.cover-issue{font-size:max(12px,.9vw);opacity:.45;margin-top:2vh}.repo-page{display:grid;grid-template-columns:55fr 45fr;gap:5vw;align-items:center}.repo-page.light{background:#f4f1eb;color:#111}.repo-page.dark{background:#111;color:#f4f1eb}.repo-left,.repo-right{position:relative;z-index:1}.rank{position:absolute;z-index:-1;top:-15vh;left:-4vw;font-family:'Readex Pro',sans-serif;font-size:33vw;font-weight:900;line-height:1;opacity:.07}.category{font-size:max(12px,1vw);font-weight:600;opacity:.58;margin-bottom:3vh}.repo-headline{font-family:'Readex Pro',sans-serif;font-size:max(34px,5.2vw);font-weight:900;line-height:1.02;margin:0 0 3vh;letter-spacing:0}.repo-path{font-family:'Readex Pro',sans-serif;font-size:max(14px,1.12vw);margin:0 0 3vh;overflow-wrap:anywhere}.repo-description{font-size:max(18px,1.5vw);line-height:1.34;max-width:48ch;margin:0;opacity:.86}.star-count{font-family:'Readex Pro',sans-serif;font-size:max(58px,7vw);font-weight:900;line-height:.9;margin-bottom:2vh}.repo-meta,.weekly-gain{font-size:max(12px,1vw);opacity:.62;margin-bottom:2vh}.weekly-gain{font-weight:600}.callout{margin-top:5vh;border-left:4px solid currentColor;padding:2.4vh 0 2.4vh 2vw;background:rgba(127,127,127,.08)}.callout-title{font-size:max(12px,.92vw);font-weight:600;margin:0 0 1.6vh;opacity:.7}.callout-text{font-size:max(17px,1.35vw);line-height:1.34;margin:0;opacity:.86;max-width:32ch}.back-title{font-family:'Readex Pro',sans-serif;font-size:max(44px,7.2vw);font-weight:900;line-height:.95;max-width:10ch}.back-meta{font-size:max(12px,1vw);opacity:.55;line-height:1.7;max-width:70ch}.dots{position:fixed;left:50%;bottom:2.5vh;transform:translateX(-50%);display:flex;gap:.55vw;z-index:10}.dot{width:.55vw;height:.55vw;min-width:7px;min-height:7px;border-radius:50%;border:1px solid currentColor;background:transparent;color:#777;opacity:.45;cursor:pointer}.dot.active{background:currentColor;opacity:.9}@media(max-width:760px){.page{padding:5vh 7vw 10vh}.repo-page{grid-template-columns:1fr;gap:4vh;align-content:center}.repo-headline{font-size:max(31px,11vw)}.repo-description{font-size:18px}.star-count{font-size:max(48px,16vw)}.callout{margin-top:2vh;padding-left:4vw}.cover-title{font-size:max(48px,17vw)}.cover-subtitle{font-size:20px}.dots{gap:6px}.dot{width:7px;height:7px}}
</style>
<style id="magazine-cover-fit">
/* Size covers against both viewport dimensions, reserving navigation space. */
.cover {
  height: 100dvh;
  min-height: 100dvh;
  padding: clamp(18px, 5dvh, 56px) 7vw clamp(48px, 9dvh, 96px);
  gap: clamp(16px, 3dvh, 32px);
  overflow: hidden;
}
.cover > div { flex-shrink: 0; min-width: 0; }
.cover .cover-title, .cover .cover__title {
  font-size: clamp(32px, min(7vw, 12dvh), 112px);
  line-height: 1;
  max-width: 14ch;
  margin: clamp(16px, 4dvh, 40px) 0 0;
  overflow-wrap: normal;
}
.cover .cover-subtitle, .cover .cover__subtitle {
  font-size: clamp(16px, min(1.6vw, 2.8dvh), 26px);
  line-height: 1.3;
  max-width: 44ch;
  margin: 0 0 clamp(12px, 2dvh, 22px);
}
.cover .cover-kicker, .cover .cover-date, .cover .cover-issue,
.cover .cover__meta, .cover .cover__date, .cover .cover__issue {
  font-size: clamp(11px, min(.9vw, 2dvh), 16px);
  line-height: 1.5;
}
.cover .cover-issue { margin-top: clamp(6px, 1dvh, 12px); }
.cover .cover__title { margin-bottom: clamp(16px, 3dvh, 32px); }
.cover .cover__meta, .cover .cover__issue { top: 5dvh; }
@media (max-width: 760px) {
  .cover .cover-title, .cover .cover__title {
    font-size: clamp(28px, min(13vw, 10dvh), 72px);
    max-width: 100%;
  }
  .cover .cover-subtitle, .cover .cover__subtitle { max-width: 100%; }
}
@media (max-height: 450px) and (min-width: 761px) {
  .cover { gap: 12px; padding-top: 16px; padding-bottom: 42px; }
  .cover .cover-title, .cover .cover__title {
    font-size: min(6vw, 10dvh);
    max-width: 22ch;
    margin-top: 12px;
  }
  .cover .cover-subtitle, .cover .cover__subtitle {
    font-size: 14px;
    max-width: 64ch;
    margin-bottom: 8px;
  }
}
</style>
</head>
<body>
<main class="magazine" id="magazine">
