</main>
<div class="dots" id="dots"></div>
<script>
const magazine = document.getElementById('magazine');
const total = magazine.children.length;
const dots = document.getElementById('dots');
let current = 0;
let lastWheel = 0;
for (let i = 0; i < total; i++) {
  const dot = document.createElement('button');
  dot.className = 'dot';
  dot.type = 'button';
  dot.setAttribute('aria-label', `Go to page ${i + 1}`);
  dot.addEventListener('click', () => go(i));
  dots.appendChild(dot);
}
function go(index) {
  current = Math.max(0, Math.min(total - 1, index));
  magazine.style.transform = `translateX(-${current * 100}vw)`;
  [...dots.children].forEach((dot, i) => dot.classList.toggle('active', i === current));
}
document.addEventListener('keydown', event => {
  if (event.key === 'ArrowRight') go(current + 1);
  if (event.key === 'ArrowLeft') go(current - 1);
});
document.addEventListener('wheel', event => {
  const now = Date.now();
  if (now - lastWheel < 700) return;
  if (Math.abs(event.deltaY) < 10 && Math.abs(event.deltaX) < 10) return;
  lastWheel = now;
  go(current + (event.deltaY > 0 || event.deltaX > 0 ? 1 : -1));
}, { passive: true });
let touchStart = null;
document.addEventListener('touchstart', event => {
  touchStart = event.changedTouches[0].clientX;
}, { passive: true });
document.addEventListener('touchend', event => {
  if (touchStart === null) return;
  const delta = touchStart - event.changedTouches[0].clientX;
  if (Math.abs(delta) > 50) go(current + (delta > 0 ? 1 : -1));
  touchStart = null;
}, { passive: true });
go(0);
</script>
</body>
</html>
